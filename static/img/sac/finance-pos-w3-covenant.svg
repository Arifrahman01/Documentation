.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">241.8%</text><text x="718.8" y="223.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">&gt;= 120.0%</text><text x="944.4" y="223.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#059669">▲ PASS (Healthy Liquidity)</text><rect x="36" y="232" width="1128" height="26" fill="#eff6ff"/><line x1="36" y1="258" x2="1164" y2="258" stroke="#e2e8f0" stroke-width="0.7"/><text x="42" y="249.68" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Debt to EBITDA (x)</text><text x="267.6" y="249.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">Total Interest-Bearing Debt / Annualized EBITDA</text><text x="493.2" y="249.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">1.48x</text><text x="718.8" y="249.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">&lt;= 3.00x</text><text x="944.4" y="249.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#059669">▲ PASS (Low Leverage)</text><rect x="36" y="258" width="1128" height="26" fill="#eff6ff"/><line x1="36" y1="284" x2="1164" y2="284" stroke="#e2e8f0" stroke-width="0.7"/><text x="42" y="275.68" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Debt Service Coverage (DSCR)</text><text x="267.6" y="275.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">EBITDA / (Principal + Interest Payment)</text><text x="493.2" y="275.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">2.84x</text><text x="718.8" y="275.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">&gt;= 1.25x</text><text x="944.4" y="275.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#059669">▲ PASS (Strong Coverage)</text><rect x="36" y="284" width="1128" height="26" fill="#eff6ff"/><line x1="36" y1="310" x2="1164" y2="310" stroke="#e2e8f0" stroke-width="0.7"/><text x="42" y="301.68" font-family="Inter, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Debt to Equity Ratio (DER)</text><text x="267.6" y="301.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">(Total Liabilities / Total Equity) * 100%</text><text x="493.2" y="301.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">46.6%</text><text x="718.8" y="301.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#0f172a">&lt;= 200.0%</text><text x="944.4" y="301.68" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" fill="#059669">▲ PASS (Conservative)</text>
